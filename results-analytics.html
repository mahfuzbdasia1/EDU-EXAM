<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results — EduExam</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="container">
    <a href="index.html" class="brand">📘 EduExam</a>
    <div class="nav-links"><a href="teacher-dashboard.html">&larr; Back to Dashboard</a></div>
  </div>
</nav>

<div class="container" style="padding-top:30px;">
  <div id="content" class="center-loading">Loading results…</div>
</div>

<footer>Built for educational use — free forever. &copy; EduExam</footer>

<script src="js/utils.js"></script>
<script src="js/report-view.js"></script>
<script type="module">
  import {
    auth, db, onAuthStateChanged, doc, getDoc, collection, query, where, getDocs,
  } from "./js/firebase-init.js";

  const params = new URLSearchParams(window.location.search);
  const examId = params.get("id");
  const content = document.getElementById("content");

  onAuthStateChanged(auth, async (user) => {
    if (!user || !user.emailVerified) { window.location.href = "teacher-login.html"; return; }
    await load(user.uid);
  });

  async function load(uid) {
    if (!examId) { content.innerHTML = `<div class="alert error">No exam specified.</div>`; return; }
    const examSnap = await getDoc(doc(db, "exams", examId));
    if (!examSnap.exists() || examSnap.data().teacherId !== uid) {
      content.innerHTML = `<div class="alert error">Exam not found or you don't have access.</div>`;
      return;
    }
    const exam = examSnap.data();

    const subQ = query(collection(db, "submissions"), where("examId", "==", examId), where("teacherId", "==", uid));
    const subSnap = await getDocs(subQ);
    const submissions = [];
    subSnap.forEach(d => submissions.push(d.data()));
    const submitted = submissions.filter(s => s.status === "submitted" || s.status === "graded");

    let avg = 0, high = 0, low = 0;
    if (submitted.length > 0) {
      const percents = submitted.map(s => s.maxScore > 0 ? (s.totalScore / s.maxScore) * 100 : 0);
      avg = Math.round(percents.reduce((a, b) => a + b, 0) / percents.length);
      high = Math.round(Math.max(...percents));
      low = Math.round(Math.min(...percents));
    }

    const rows = submitted.length === 0
      ? `<tr><td colspan="6" style="text-align:center; color:var(--muted);">No submissions yet.</td></tr>`
      : submitted.map((s, idx) => `
        <tr>
          <td>${EduUtils.escapeHtml(s.studentName)}</td>
          <td>${EduUtils.escapeHtml(s.studentRoll || "-")}</td>
          <td>${s.totalScore} / ${s.maxScore}</td>
          <td>${s.maxScore > 0 ? Math.round((s.totalScore / s.maxScore) * 100) : 0}%</td>
          <td>${s.tabSwitchCount || 0}</td>
          <td><button class="btn secondary small rptBtn" data-i="${idx}">🖨 Report</button></td>
        </tr>`).join("");

    content.innerHTML = `
      <h2>${EduUtils.escapeHtml(exam.title)} — Results</h2>
      <div class="card" style="display:flex; gap:30px; flex-wrap:wrap;">
        <div><div style="color:var(--muted); font-size:13px;">Submissions</div><div style="font-size:24px; font-weight:700;">${submitted.length}</div></div>
        <div><div style="color:var(--muted); font-size:13px;">Average</div><div style="font-size:24px; font-weight:700;">${avg}%</div></div>
        <div><div style="color:var(--muted); font-size:13px;">Highest</div><div style="font-size:24px; font-weight:700;">${high}%</div></div>
        <div><div style="color:var(--muted); font-size:13px;">Lowest</div><div style="font-size:24px; font-weight:700;">${low}%</div></div>
      </div>
      <div class="card">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
          <strong>Student Results</strong>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn secondary small" id="printAllBtn">🖨 Print all reports (PDF)</button>
            <button class="btn secondary small" id="exportBtn">Export CSV</button>
          </div>
        </div>
        <table>
          <thead><tr><th>Name</th><th>Roll</th><th>Score</th><th>%</th><th>Tab-switches</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;

    document.getElementById("exportBtn")?.addEventListener("click", () => exportCsv(exam, submitted));

    // Free reports (no email needed): browser print dialog -> "Save as PDF".
    const reportFor = (s) => EduReport.buildStudentReport({
      examTitle: exam.title, studentName: s.studentName, roll: s.studentRoll,
      totalScore: s.totalScore, maxScore: s.maxScore,
      questions: exam.questions, answers: s.answers || {},
    });
    document.getElementById("printAllBtn")?.addEventListener("click", () => {
      if (submitted.length === 0) { EduUtils.toast("No submissions to print yet.", "info"); return; }
      EduReport.print(
        EduReport.buildClassSummary({ examTitle: exam.title, questions: exam.questions, submissions: submitted }) +
        submitted.map(reportFor).join("")
      );
    });
    document.querySelectorAll(".rptBtn").forEach(b => b.addEventListener("click", () => {
      EduReport.print(reportFor(submitted[Number(b.dataset.i)]));
    }));
  }

  // Quote every cell, neutralise spreadsheet formulas (=,+,-,@), and prefix a BOM so
  // Excel shows Bangla names correctly.
  function csvCell(v) {
    let t = v === undefined || v === null ? "" : v;
    if (typeof t === "string" && /^[=+\-@\t\r]/.test(t)) t = "'" + t;
    return `"${String(t).replace(/"/g, '""')}"`;
  }

  function exportCsv(exam, submissions) {
    const qs = exam.questions || [];
    const lines = [["Name", "Roll", "Score", "Max", "Percent", "TabSwitches", ...qs.map((_, i) => `Q${i + 1}`)].map(csvCell).join(",")];
    submissions.forEach(s => {
      const percent = s.maxScore > 0 ? Math.round((s.totalScore / s.maxScore) * 100) : 0;
      const marks = qs.map(q => EduUtils.gradeQuestion(q, (s.answers || {})[q.id]).earned);
      lines.push([s.studentName, s.studentRoll || "", s.totalScore, s.maxScore, percent, s.tabSwitchCount || 0, ...marks].map(csvCell).join(","));
    });
    const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${(exam.title || "exam").replace(/[^\p{L}\p{N}]+/gu, "_")}_results.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }
</script>
</body>
</html>
